<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Animals</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0c; color: #e5e7eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #hero { position: relative; overflow: hidden; height: 100vh; }
    </style>
  </head>
  <body>
    <section id="hero"></section>
    <script type="module">
      import { createAsciiField } from './src/index.ts';
      // ?animal= ?t= ?seed= ?cell= ?count= ?debug
      const Q = new URLSearchParams(location.search);
      const num = (k) => (Q.has(k) && Q.get(k) !== '' ? Number(Q.get(k)) : undefined);
      const cell = num('cell');
      window.__field = createAsciiField({
        host: document.getElementById('hero'),
        animal: Q.get('animal') || undefined,
        seed: num('seed'),
        count: num('count'),
        stillT: num('t'),
        debug: Q.has('debug'),
        persist: !Q.has('animal'), // remember the switcher's choice unless an animal is forced in the URL
        tweaks: cell ? { cellSize: cell } : undefined,
      });
    </script>
  </body>
</html>
