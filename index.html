<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII field demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0c; color: #e5e7eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #hero { position: relative; overflow: hidden; height: 100vh; display: grid; place-items: center; }
      .hero-content { position: relative; z-index: 1; text-align: center; padding: 24px; }
      h1 { font-size: clamp(40px, 6vw, 72px); margin: 0 0 12px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: #a1a1aa; }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <section id="hero">
      <div class="hero-content" data-af-dim>
        <h1>Abin Binu</h1>
        <p>Ambient ASCII animals, drawn one character cell at a time.</p>
        <a href="#">a link — clicking this must not scatter</a>
      </div>
    </section>
    <script type="module">
      import { createAsciiField } from './src/index.ts';
      // ?animal= ?t= ?seed= ?cell= ?count= ?debug
      const Q = new URLSearchParams(location.search);
      const num = (k) => (Q.has(k) && Q.get(k) !== '' ? Number(Q.get(k)) : undefined);
      const cell = num('cell');
      window.__field = createAsciiField({
        host: document.getElementById('hero'),
        animal: Q.get('animal') || undefined,
        seed: num('seed'),
        count: num('count'),
        stillT: num('t'),
        debug: Q.has('debug'),
        persist: false,
        tweaks: cell ? { cellSize: cell } : undefined,
      });
    </script>
  </body>
</html>
